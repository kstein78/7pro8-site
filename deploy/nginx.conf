# Alternative to Caddy, if nginx is already running on the server.
# TLS certificates via certbot: certbot --nginx -d 7pro8.com -d www.7pro8.com

server {
    listen 80;
    listen [::]:80;
    server_name 7pro8.com www.7pro8.com;
    return 301 https://www.7pro8.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 7pro8.com;
    # ssl_certificate / ssl_certificate_key managed by certbot
    return 301 https://www.7pro8.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.7pro8.com;

    root /srv/7pro8/current;
    index index.html;

    # ssl_certificate / ssl_certificate_key managed by certbot

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;

    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
