<section class="hero">
  <div class="shell hero__inner">
    <div class="hero__text">
      <h1 class="hero__title">{{ block.title }}</h1>
      <p class="hero__lead">{{ block.lead }}</p>
      {% if block.actions %}
      <p class="hero__actions">
        {% for a in block.actions %}
        <a class="btn{% if not loop.first %} btn--quiet{% endif %}" href="{{ a.href }}">{{ a.label }}</a>
        {% endfor %}
      </p>
      {% endif %}
    </div>

    <figure class="glass" data-glass>
      <img src="{{ img(block.image.src, block.image.alt) }}" alt="{{ block.image.alt }}" width="1200" height="800">
      <span class="glass__tint" aria-hidden="true"></span>
      <figcaption class="glass__bar">
        <span class="glass__caption">{{ block.image.caption }}</span>
        <button type="button" class="glass__switch" data-glass-toggle aria-pressed="false">
          <span class="glass__switch-track" aria-hidden="true"><span class="glass__switch-knob"></span></span>
          <span class="glass__switch-label" data-glass-label data-on="{{ block.image.toggle_on }}" data-off="{{ block.image.toggle_off }}">{{ block.image.toggle_off }}</span>
        </button>
      </figcaption>
    </figure>
  </div>

  {% if block.facts %}
  <div class="shell">
    <dl class="facts">
      {% for f in block.facts %}
      <div class="facts__item">
        <dt class="facts__value">{{ f.value }}</dt>
        <dd class="facts__label">{{ f.label }}</dd>
      </div>
      {% endfor %}
    </dl>
  </div>
  {% endif %}
</section>
