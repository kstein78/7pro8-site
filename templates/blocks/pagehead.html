<section class="pagehead">
  <div class="shell pagehead__inner">
    <p class="eyebrow">{{ block.kicker or page.title }}</p>
    <h1 class="pagehead__title">{{ block.title }}</h1>
    {% if block.lead %}<p class="pagehead__lead">{{ block.lead }}</p>{% endif %}
    {% if block.meta %}
    <dl class="pagehead__meta">
      {% for m in block.meta %}
      <div><dt>{{ m.label }}</dt><dd>{{ m.value }}</dd></div>
      {% endfor %}
    </dl>
    {% endif %}
  </div>
</section>
