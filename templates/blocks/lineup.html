<section class="band{% if block.tone == 'dark' %} tone-dark{% endif %}">
  <div class="shell">
    {% if block.title %}<h2 class="h2">{{ block.title }}</h2>{% endif %}
    {% if block.lead %}<p class="lead lead--wide">{{ block.lead }}</p>{% endif %}
    <div class="lineup">
      {% for g in block.groups %}
      <section class="lineup__group lineup__group--{{ g.kind }}">
        <h3 class="lineup__status">{{ g.status }}</h3>
        <p class="lineup__note">{{ g.text }}</p>
        <ul class="lineup__items">
          {% for i in g['items'] %}<li>{{ i }}</li>{% endfor %}
        </ul>
      </section>
      {% endfor %}
    </div>
    {% if block.footnote %}<p class="footnote">{{ block.footnote }}</p>{% endif %}
  </div>
</section>
